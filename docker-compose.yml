services:
  dev:
    build:
      context: .
      target: dev
    image: raspberry-milkshake-dev
    working_dir: /src
    volumes:
      - .:/src
      # Build tree lives in a named volume so artifacts never land in the (OneDrive-synced) repo folder.
      - build:/build
      - presets:/presets

  test:
    extends:
      service: dev
    command: >
      bash -c "cmake --preset container
      && cmake --build --preset container
      && ctest --preset container"

  # Browser dashboard at http://localhost:8080: main output, touch display (via noVNC on 6080),
  # LED chain and status.
  dashboard:
    extends:
      service: dev
    ports:
      # Bound to this machine only.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - presets:/presets
      # Compiled shaders are kept between runs: the first frame after a preset switch is 10x faster
      # when the preset's shaders are already in this cache.
      - shadercache:/cache
    environment:
      RM_APP_ARGS: ${RM_APP_ARGS:-}
      MESA_SHADER_CACHE_DIR: /cache/mesa
      MESA_SHADER_CACHE_MAX_SIZE: 2G
    command: bash tools/dev/run-dashboard.sh
    # Healthy once the dashboard page answers; the first start builds everything, so allow time.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 20s

  # Downloads a community MilkDrop preset pack into the presets volume (once).
  fetch-presets:
    extends:
      service: dev
    volumes:
      - presets:/presets
    command: >
      bash -c "test -d /presets/cream-of-the-crop
      || git clone --depth 1 https://github.com/projectM-visualizer/presets-cream-of-the-crop /presets/cream-of-the-crop;
      echo presets available: $$(find /presets -name '*.milk' | wc -l)"

volumes:
  build:
  presets:
  shadercache:
