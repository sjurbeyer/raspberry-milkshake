services:
  dev:
    build:
      context: .
      target: dev
    image: raspberry-milkshake-dev
    working_dir: /src
    volumes:
      - .:/src
      # Build tree lives in a named volume so artifacts never land in the (OneDrive-synced) repo folder.
      - build:/build

  test:
    extends:
      service: dev
    command: >
      bash -c "cmake --preset container
      && cmake --build --preset container
      && ctest --preset container"

  # Browser dashboard at http://localhost:8080: main output, touch display (via noVNC on 6080),
  # LED chain and status.
  dashboard:
    extends:
      service: dev
    ports:
      # Bound to this machine only.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
    volumes:
      - presets:/presets
    environment:
      RM_APP_ARGS: ${RM_APP_ARGS:-}
    command: bash tools/dev/run-dashboard.sh

  # Downloads a community MilkDrop preset pack into the presets volume (once).
  fetch-presets:
    extends:
      service: dev
    volumes:
      - presets:/presets
    command: >
      bash -c "test -d /presets/cream-of-the-crop
      || git clone --depth 1 https://github.com/projectM-visualizer/presets-cream-of-the-crop /presets/cream-of-the-crop;
      echo presets available: $$(find /presets -name '*.milk' | wc -l)"

volumes:
  build:
  presets:
